name: Daily Cleanup Cron Job

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DevScaffold Storage Cleanup
        env:
          API_URL: ${{ secrets.DEVSCAFFOLD_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is not set. Please add DEVSCAFFOLD_API_URL to GitHub Secrets."
            exit 1
          fi
          
          # Masked log
          MASKED_URL=$(echo "$API_URL" | sed 's/\(http.*\/\/\).*/\1***/')
          echo "Triggering cleanup at $MASKED_URL/api/storage/cleanup/"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -f -X POST "$API_URL/api/storage/cleanup/" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          # Extract the body and HTTP status code from curl output
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Cleanup ping failed with status $HTTP_STATUS"
            exit 1
          fi
          
          echo "Cleanup ping successful!"
