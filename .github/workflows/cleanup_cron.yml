name: Daily Cleanup Cron Job

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DevScaffold Storage Cleanup
        env:
          API_URL: ${{ secrets.DEVSCAFFOLD_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is not set. Please add DEVSCAFFOLD_API_URL to GitHub Secrets."
            exit 1
          fi
          
          # Normalize URL (strip trailing slash if present)
          CLEAN_URL=$(echo "$API_URL" | sed 's:/*$::')
          
          # Masked log for security
          MASKED_URL=$(echo "$CLEAN_URL" | sed 's/\(http.*\/\/\).*/\1***/')
          echo "Triggering cleanup at $MASKED_URL/api/storage/cleanup/"
          
          # Use curl to get body and status. Remove -f so we can capture the body on error.
          # We use a temporary file to separate body and status.
          CURL_OUT=$(curl -s -w "\n%{http_code}" -X POST "${CLEAN_URL}/api/storage/cleanup/" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$CURL_OUT" | head -n -1)
          HTTP_STATUS=$(echo "$CURL_OUT" | tail -n 1)
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Content: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Cleanup ping failed with status $HTTP_STATUS. See logs above for response body."
            exit 1
          fi
          
          echo "Cleanup process completed successfully!"
